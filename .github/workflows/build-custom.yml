name: Build Custom SM8250 Kernel (Android 17 + Multi-Manager)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Device Model Code (x1q, c1q, c2q, z3q, y2q, r8q, gts7xl, etc.)'
        required: true
        default: 'r8q'
      variant:
        description: 'SELinux Variant'
        required: true
        default: 'ksu'
        type: choice
        options:
          - ksu
          - ksu-permissive

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Submodules and Setup NoMount
        run: |
          echo "Cleaning broken KernelSU submodule from git config..."
          # Remove orphaned entries from .git/config to prevent 'fatal: No url found'
          git config --local --remove-section submodule.KernelSU 2>/dev/null || true
          git config --local --remove-section submodule.NoMount 2>/dev/null || true
          
          rm -rf .git/modules/KernelSU .git/modules/NoMount
          rm -rf KernelSU NoMount fs/nomount
          
          echo "Syncing and updating valid submodules..."
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          
          echo "Integrating NoMount manually (Official Method)..."
          git clone --depth=1 https://github.com/maxsteeel/nomount.git NoMount_temp
          
          mkdir -p fs/nomount
          # Copy all files including hidden ones from kernel/src to fs/nomount
          cp -a NoMount_temp/kernel/src/. fs/nomount/
          
          # Ensure fs/Makefile has nomount
          if ! grep -q "nomount" fs/Makefile; then
              echo "obj-\$(CONFIG_NOMOUNT) += nomount/" >> fs/Makefile
          fi
          
          # Ensure fs/Kconfig has nomount source
          if ! grep -q "fs/nomount/Kconfig" fs/Kconfig; then
              echo 'source "fs/nomount/Kconfig"' >> fs/Kconfig
          fi
          
          rm -rf NoMount_temp

      - name: Clean up existing KernelSU directory
        run: |
          echo "Removing existing drivers/kernelsu directory..."
          git rm -rf drivers/kernelsu 2>/dev/null || true
          rm -rf drivers/kernelsu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ca-certificates flex git libelf-dev libssl-dev ncurses-base wget zip zstd jq curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup KernelSU (backslashxx fork)
        run: |
          echo "Cloning backslashxx KernelSU..."
          git clone --depth=1 https://github.com/backslashxx/KernelSU /tmp/ksu_temp
          
          mkdir -p drivers/kernelsu
          cp -a /tmp/ksu_temp/kernel/. drivers/kernelsu/
          rm -rf /tmp/ksu_temp
          
          grep -q "kernelsu" drivers/Makefile || echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
          grep -q "kernelsu" drivers/Kconfig || echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          
          echo "Applying Multi-Manager Bypass Patch..."
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) | while read file; do
            sed -i 's/uid == ksu_manager_uid/true \/\* Multi-Manager \*\/ || uid == ksu_manager_uid/g' "$file"
            sed -i 's/ksu_is_manager(uid)/true \/\* Multi-Manager \*\/ || ksu_is_manager(uid)/g' "$file"
            sed -i 's/ksu_is_manager_apk(uid)/true \/\* Multi-Manager \*\/ || ksu_is_manager_apk(uid)/g' "$file"
            sed -i 's/expected_manager_uid/true \/\* Multi-Manager \*\/ || expected_manager_uid/g' "$file"
          done

      - name: Setup AOSP & Android 17 Configs (Strip OneUI)
        run: |
          mkdir -p vendor/not
          cat <<EOF > vendor/not/custom_aosp.config
          # DISABLE ONEUI / SAMSUNG BLOAT
          # CONFIG_SEC_PLATFORM is not set
          # CONFIG_SENSORS_SSP is not set
          # CONFIG_SEC_FACTORY is not set
          # CONFIG_SEC_DEBUG is not set
          # CONFIG_SEC_THERMAL is not set
          # CONFIG_SEC_BATTERY is not set
          # CONFIG_SEC_VIBRATION is not set
          # CONFIG_SAMSUNG_PM is not set
          # CONFIG_SAMSUNG_PM_DEBUG is not set

          # ANDROID 17 (AOSP) REQUIREMENTS (eBPF)
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y

          # KERNELSU CONFIGURATION
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          EOF

      - name: Download Neutron Clang Toolchain
        run: |
          mkdir -p tc/clang
          echo "Downloading latest Neutron Clang..."
          ASSET_URL=$(curl -fsSL https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest | jq -r '.assets[] | select(.name | endswith(".tar.zst")) | .browser_download_url' | head -n1)
          curl -L "$ASSET_URL" | tar --zstd -x -C tc/clang --strip-components=1
          echo "$(pwd)/tc/clang/bin" >> $GITHUB_PATH

      - name: Compile Kernel
        run: |
          MODEL="${{ github.event.inputs.model }}"
          export PLATFORM_VERSION=11
          
          PLATFORM_DEFCONFIG="vendor/kona-perf_defconfig"
          COMMON_DEFCONFIG="vendor/samsung/kona-sec-common.config"
          PROJECT_CONFIG="vendor/samsung/${MODEL}.config"
          EXTRA_CONFIG="vendor/not/ksu.config vendor/not/custom_aosp.config vendor/not/localversion.config"
          
          if [ "${{ github.event.inputs.variant }}" == "ksu-permissive" ]; then
            EXTRA_CONFIG="$EXTRA_CONFIG vendor/not/permissive.config"
          fi
          
          DEFCONFIG="$PLATFORM_DEFCONFIG $COMMON_DEFCONFIG $PROJECT_CONFIG $EXTRA_CONFIG"
          
          mkdir -p out
          echo "Running make defconfig..."
          make O=out ARCH=arm64 CC=clang $DEFCONFIG
          make O=out ARCH=arm64 CC=clang olddefconfig
          
          MAKE_ARGS="-j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AS=llvm-as AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          echo "Starting Compilation..."
          make $MAKE_ARGS dtbo.img Image.gz
          
          # Generate DTB
          mkdir -p out/arch/arm64/boot/dts/vendor/qcom
          cat $(find out/arch/arm64/boot/dts/vendor/qcom -name "*.dtb" | sort) > out/arch/arm64/boot/dtb

      - name: Package into AnyKernel3
        run: |
          MODEL="${{ github.event.inputs.model }}"
          echo "Cloning AnyKernel3..."
          git clone -q -b "$MODEL" https://github.com/notkernel-oss/AnyKernel3 AnyKernel3 || git clone -q https://github.com/notkernel-oss/AnyKernel3 AnyKernel3
          
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/dtb AnyKernel3/
          
          cd AnyKernel3
          zip -r9 "../CustomKernel-${MODEL}-Android17.zip" * -x .git README.md *placeholder
          cd ..

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomKernel-${{ github.event.inputs.model }}-Android17
          path: CustomKernel-${{ github.event.inputs.model }}-Android17.zip
          retention-days: 7
